<!doctype html>
<!--
  Diagnostic page — not part of the app.

  The ad slot lives behind a LINE login, so the only person who could observe it
  misbehaving was the user, which is no way to debug anything. This page is the
  same shell the dashboard uses (a 100dvh flex row, a fixed-width rail, a
  clipped scrolling column) with the same AdSense unit in it, on the same
  origin, reachable without signing in. It records what the library does to the
  document so the cause can be read off rather than guessed at.

  Delete once the ad question is settled.
-->
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ad diagnostic 3 — beond</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { font: 14px system-ui, sans-serif; background: #eef1f5; }
      .shell { display: flex; height: 100dvh; overflow: hidden; }
      .rail { width: 240px; flex-shrink: 0; background: #fff; border-right: 1px solid #0001; padding: 24px 20px; }
      .col { display: flex; min-width: 0; flex: 1; flex-direction: column; min-height: 0; overflow: hidden; }
      .grid { display: grid; flex: 1; min-height: 0; gap: 24px; overflow: hidden; padding: 24px;
              grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); }
      .left { display: flex; min-height: 0; flex-direction: column; gap: 16px; }
      .card { border-radius: 24px; background: #fff; padding: 20px; }
      .card.grow { flex: 1; min-height: 0; overflow: auto; }
      .right { border-radius: 24px; background: linear-gradient(#779bc6, #fff); }
      #report { position: fixed; inset: auto 8px 8px 8px; max-height: 42vh; overflow: auto; z-index: 999;
                border-radius: 12px; background: #111; color: #0f0; padding: 10px; font: 11px/1.4 ui-monospace, monospace;
                white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="rail"><b>rail</b><br />fixed width, full height</div>
      <div class="col">
        <div class="grid">
          <div class="left">
            <div class="card"><b>portfolio card</b></div>
            <!-- The slot under test, exactly as the app renders it. -->
            <div id="slot" style="position:relative;flex-shrink:0;height:90px;overflow:hidden;border-radius:24px;background:#fff">
              <!-- Variant: a fixed unit, no auto format, no full-width
                   responsive — and Google's own opt-out of ablation declared up
                   front rather than left for it to insert. -->
              <!-- Variant 3: the responsive unit we actually want, with only
                   the ablation opt-out added. Isolates which of the two changes
                   in variant 2 was the one that mattered. -->
              <ins class="adsbygoogle adsbygoogle-noablate" style="display:none"></ins>
              <ins class="adsbygoogle"
                   style="display:block;width:100%;height:90px"
                   data-ad-client="ca-pub-9996803394317025"
                   data-ad-slot="8039412704"
                   data-ad-format="horizontal"
                   data-full-width-responsive="true"></ins>
            </div>
            <div class="card grow"><b>holdings card</b> — takes the rest of the column</div>
          </div>
          <div class="right"></div>
        </div>
      </div>
    </div>

    <pre id="report">measuring…</pre>

    <script>
      // Measure the shell before Google is allowed anywhere near it, then again
      // after, and report the difference plus everything the library added.
      const shell = document.querySelector(".shell");
      const before = {
        shellH: Math.round(shell.getBoundingClientRect().height),
        bodyH: Math.round(document.body.scrollHeight),
        htmlStyle: document.documentElement.getAttribute("style"),
        bodyStyle: document.body.getAttribute("style"),
      };

      const report = (label) => {
        const now = {
          shellH: Math.round(shell.getBoundingClientRect().height),
          bodyH: Math.round(document.body.scrollHeight),
          htmlStyle: document.documentElement.getAttribute("style"),
          bodyStyle: document.body.getAttribute("style"),
        };
        const shellInline = document.querySelector(".shell").getAttribute("style");
        const added = [...document.querySelectorAll("ins, iframe, [class*=google], [id*=google], [id*=aswift]")]
          .filter((n) => n.id !== "report")
          .map((n) => {
            const b = n.getBoundingClientRect();
            return [
              n.tagName.toLowerCase(),
              n.id && "#" + n.id,
              n.className && "." + String(n.className).trim().split(/\s+/).join("."),
              getComputedStyle(n).position,
              Math.round(b.width) + "x" + Math.round(b.height) + "@" + Math.round(b.top),
              "in:" + (n.parentElement?.id || n.parentElement?.className || n.parentElement?.tagName || ""),
            ].filter(Boolean).join(" ");
          });
        document.getElementById("report").textContent = JSON.stringify(
          { label, before, now, shellInline, changed: JSON.stringify(before) !== JSON.stringify(now), added },
          null,
          1,
        );
      };
      report("before script");

      const s = document.createElement("script");
      s.async = true;
      s.crossOrigin = "anonymous";
      s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9996803394317025";
      s.onload = () => {
        (window.adsbygoogle = window.adsbygoogle || []).push({});
        setTimeout(() => report("2s after push"), 2000);
        setTimeout(() => report("6s after push"), 6000);
      };
      s.onerror = () => report("script failed to load");
      document.head.appendChild(s);
    </script>
  </body>
</html>
